name: Release

# On a published release: build the plugin, seal it with fylr-build-plugin
# seal (public key only — no secrets), attach the sealed plugin to the
# release, and publish it to GitHub Pages at an unguessable URL (a per-repo
# UUID in the filename) — the same delivery mechanism the other fylr plugins
# use. A licensed plugin repo is normally private, so that Pages URL is the
# only handle to the artifact; sealing means a leaked URL still yields nothing
# without fylr's key. -latest.zip always serves the latest real release;
# -prerelease.zip next to it serves the newest published release, prerelease
# or not, for developers testing a prerelease (the "plugin prerelease url" of
# the plugins sheet).
on:
  release:
    types:
      - published
      - edited

env:
  # Unguessable, stable per repo — the "hash" in the Pages filename. Generate a
  # fresh one (uuidgen) for a real plugin so its URL cannot be derived from this
  # template.
  ZIP_HASH: a5c6d4ba-9284-4b36-acf2-42ddbfa31edf
  SEALED: example-licensed_sealed.zip

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          # a plugin repo has no go.mod for the dependency cache to key on
          cache: false

      - name: Build and seal the plugin
        run: make seal        # -> build/example-licensed_sealed.zip
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Attach sealed plugin to the release
        uses: softprops/action-gh-release@v3
        with:
          files: build/${{ env.SEALED }}

      # A Pages deploy replaces the whole site, so a prerelease puts the latest
      # real release back as -latest.zip, downloaded unchanged from that
      # release: a rebuild would change the sha256 the marketplace pins.
      - name: Prepare GitHub Pages upload (unguessable filenames)
        run: |
          mkdir -p public
          cp build/${{ env.SEALED }} \
             public/${{ github.event.repository.name }}-${{ env.ZIP_HASH }}-prerelease.zip
          if [ "$PRERELEASE" != true ]; then
            cp build/${{ env.SEALED }} \
               public/${{ github.event.repository.name }}-${{ env.ZIP_HASH }}-latest.zip
            exit 0
          fi
          latest=$(gh release list -R "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
            --limit 1 --json tagName --jq '.[0].tagName // ""')
          if [ -z "$latest" ]; then
            echo "::notice::no real release yet, Pages serves only the prerelease"
            exit 0
          fi
          gh release download "$latest" -R "$GITHUB_REPOSITORY" \
            --pattern ${{ env.SEALED }} \
            --output public/${{ github.event.repository.name }}-${{ env.ZIP_HASH }}-latest.zip
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
          GH_TOKEN: ${{ github.token }}

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Show the prerelease url
        run: |
          echo "prerelease url: ${PAGE_URL%/}/${{ github.event.repository.name }}-${{ env.ZIP_HASH }}-prerelease.zip" \
            >> "$GITHUB_STEP_SUMMARY"
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
